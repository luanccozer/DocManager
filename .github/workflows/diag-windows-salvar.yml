# TEMPORÁRIO - diagnóstico do "Permissão negada" ao salvar no Windows (3.6.1-rc.1).
# Roda só neste branch; sai do repositório no commit da correção.
name: Diagnóstico Windows - salvar Excel

on:
  push:
    branches: ["claude/intelligent-franklin-g8byqp"]
    paths: [".github/workflows/diag-windows-salvar.yml", "docmanager/services/gravacao.py", "tests/test_gravacao.py"]

jobs:
  salvar:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Dependências (as mesmas do build)
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -c constraints-build.txt
          pip install -r requirements-dev.txt -c constraints-build.txt
      - name: Testes da gravação e do seletor de arquivo, no Windows
        shell: bash
        run: python -m pytest -v -p no:cacheprovider tests/test_gravacao.py tests/test_ui_telas.py -k "gravacao or salvar or planilha_aberta or seletor_de_arquivo or motivo or programa or pasta"
