# ════════════════════════════════════════════════════════════════════════════
#  Release do DocManager Itaipu — build + instalador + publicação
#
#  Como se lança uma versão nova (é só isto):
#     1. acrescente o bloco da versão no CHANGELOG.md e faça commit;
#     2. git tag v3.1.1 && git push origin v3.1.1
#  O resto acontece aqui: o Windows da GitHub gera o .exe com o PyInstaller,
#  monta o instalador com o Inno Setup, calcula o SHA256 e publica o Release.
#  Os apps já instalados avisam sozinhos na próxima abertura.
#
#  Segredo necessário (Settings → Secrets and variables → Actions):
#     UPDATE_TOKEN — PAT fine-grained, SOMENTE LEITURA (Contents: Read-only),
#                    restrito a ESTE repositório. É ele que o app embute para
#                    conseguir ler os Releases, já que o repositório é privado.
#                    Sem o segredo o build sai sem atualização automática (e o
#                    workflow avisa) — nada quebra.
#  Ver BUILD.md, seção "Rotação do token".
# ════════════════════════════════════════════════════════════════════════════
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      versao:
        description: "Versão a publicar, sem o 'v' (ex.: 3.1.0, ou 3.1.1-rc.1 para teste)"
        required: true
        type: string
      prerelease:
        description: "Pré-lançamento (o app NÃO oferece pré-lançamentos como atualização). Desmarque para publicar de verdade."
        required: false
        default: true
        type: boolean

permissions:
  contents: write        # necessário para criar o Release e subir os assets

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      # Windows roda o Python em cp1252 por padrão, e qualquer `print` com "→"
      # ou acento derruba o passo com UnicodeEncodeError — o build morre por
      # causa de uma MENSAGEM, depois de lint e testes já terem passado.
      # PYTHONUTF8=1 liga o modo UTF-8 do Python para o job inteiro.
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # A versão é a TAG (v3.1.0 → 3.1.0). Num disparo manual, vem da entrada
      # e o release sai marcado como pré-lançamento.
      - name: Definir a versão
        id: versao
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            versao="${{ inputs.versao }}"
            echo "prerelease=${{ inputs.prerelease }}" >> "$GITHUB_OUTPUT"
          else
            versao="${GITHUB_REF_NAME#v}"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi
          versao="${versao#v}"
          # O Windows exige um numero de versao SO COM DIGITOS no recurso do
          # binario (VersionInfoVersion do .iss). "3.1.0-rc.1" faz o Inno abortar,
          # entao o sufixo de pre-lancamento e cortado aqui: 3.1.0-rc.1 -> 3.1.0.
          numerica="${versao%%-*}"
          echo "versao=$versao"       >> "$GITHUB_OUTPUT"
          echo "numerica=$numerica"   >> "$GITHUB_OUTPUT"
          echo "tag=v$versao"         >> "$GITHUB_OUTPUT"
          echo "Versão desta publicação: $versao (binário: $numerica)"

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
          pip install "pyinstaller>=6,<7"

      # Portão rápido: 2 minutos de teste antes de gastar 10 no empacotamento.
      # Uma versão publicada quebrada é muito mais cara de desfazer.
      - name: Lint e testes
        run: |
          ruff check .
          pytest -q

      - name: Carimbar versão e embutir o token
        id: carimbo
        shell: bash
        env:
          DOCMANAGER_UPDATE_TOKEN: ${{ secrets.UPDATE_TOKEN }}
        run: |
          python tools/preparar_build.py "${{ steps.versao.outputs.versao }}" \
            --origem github-actions --commit "${{ github.sha }}"
          # `secrets` não é um contexto válido em `if:` de passo — por isso a
          # presença do token vira um output aqui.
          if [ -z "$DOCMANAGER_UPDATE_TOKEN" ]; then
            echo "tem_token=false" >> "$GITHUB_OUTPUT"
          else
            echo "tem_token=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Avisar se o token não está configurado
        if: steps.carimbo.outputs.tem_token == 'false'
        run: |
          echo "::warning title=Sem UPDATE_TOKEN::O segredo UPDATE_TOKEN nao esta definido. Este build NAO tera atualizacao automatica - quem instalar precisara baixar as proximas versoes a mao. Veja a secao 'Rotacao do token' do BUILD.md."

      - name: Gerar o executável (PyInstaller)
        run: pyinstaller docmanager.spec --noconfirm

      - name: Conferir que o .exe saiu
        shell: bash
        run: |
          test -f dist/DocManager/DocManager.exe \
            || { echo "::error::PyInstaller terminou sem gerar o DocManager.exe"; exit 1; }
          ls -la dist/DocManager/DocManager.exe

      # O Inno Setup já vem na imagem windows-latest; o fallback cobre a
      # eventualidade de a imagem mudar (já aconteceu antes) sem quebrar o release.
      - name: Garantir o Inno Setup
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            Write-Host "Inno Setup não encontrado na imagem — instalando via Chocolatey."
            choco install innosetup --no-progress -y
          }
          "ISCC=$iscc" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Montar o instalador
        shell: pwsh
        run: |
          & "$env:ISCC" "/DMyAppVersion=${{ steps.versao.outputs.versao }}" `
                        "/DMyVersionInfo=${{ steps.versao.outputs.numerica }}" `
                        installer\docmanager.iss
          $origem = "installer/Output/DocManager_Itaipu_Setup.exe"
          if (-not (Test-Path $origem)) { throw "O Inno Setup não gerou o instalador." }
          # Nome com a versão: nos Downloads de quem baixa, "Setup.exe" sozinho
          # não diz nada e os arquivos se sobrescrevem. Barras normais de
          # propósito: o passo que publica o Release roda em bash.
          $destino = "installer/Output/DocManager_Itaipu_Setup_${{ steps.versao.outputs.versao }}.exe"
          Move-Item $origem $destino -Force
          "INSTALADOR=$destino" | Out-File -FilePath $env:GITHUB_ENV -Append

      # O manifesto (que o app lê para conferir o SHA256 antes de instalar) e as
      # notas do Release saem do mesmo script: ele lê o CHANGELOG, calcula o
      # hash e grava os dois em UTF-8 sem BOM. Era PowerShell + heredoc de bash,
      # e o texto com acento do CHANGELOG quebrava os dois no Windows.
      - name: Gerar o manifesto e as notas do Release
        shell: bash
        run: |
          python tools/gerar_manifesto.py \
            --instalador "$INSTALADOR" \
            --versao "${{ steps.versao.outputs.versao }}" \
            --tag "${{ steps.versao.outputs.tag }}"

      - name: Publicar o Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.versao.outputs.tag }}
          VERSAO: ${{ steps.versao.outputs.versao }}
          PRERELEASE: ${{ steps.versao.outputs.prerelease }}
        shell: bash
        run: |
          ativos=("$INSTALADOR#Instalador do DocManager Itaipu"
                  "latest.json#Manifesto (versão + SHA256)")
          if [ "$PRERELEASE" = "true" ]; then sinal="--prerelease"; else sinal="--prerelease=false"; fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "O release $TAG já existe — anexando os arquivos a ele."
            gh release upload "$TAG" "${ativos[@]}" --clobber
            gh release edit "$TAG" \
              --title "DocManager Itaipu v$VERSAO" \
              --notes-file notas_release.md "$sinal"
          else
            echo "Criando o release $TAG."
            # --target: a tag, quando ainda não existe, nasce apontando para
            # este commit — e não para o topo da branch padrão no momento.
            gh release create "$TAG" "${ativos[@]}" \
              --target "${{ github.sha }}" \
              --title "DocManager Itaipu v$VERSAO" \
              --notes-file notas_release.md "$sinal"
          fi
          echo "─── publicado ───"
          gh release view "$TAG"

      # Guardado por 30 dias: se alguém precisar do build sem passar pelo
      # instalador (teste rápido, diagnóstico), está aqui.
      - name: Guardar os artefatos do build
        uses: actions/upload-artifact@v4
        with:
          name: DocManager-${{ steps.versao.outputs.versao }}
          path: |
            installer/Output/*.exe
            latest.json
          retention-days: 30
