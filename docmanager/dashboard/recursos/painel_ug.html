// Períodos (dia, semana, mês, trimestre, ano) para os gráficos no tempo.
function chavePeriodo(d, g) {
  if (g === "dia") return `${d.getFullYear()}-${p2(d.getMonth() + 1)}-${p2(d.getDate())}`;
  if (g === "semana") { const s = somaDias(d, -((d.getDay() + 6) % 7)); return `${s.getFullYear()}-${p2(s.getMonth() + 1)}-${p2(s.getDate())}`; }
  if (g === "trimestre") return `${d.getFullYear()}-T${Math.floor(d.getMonth() / 3) + 1}`;
  if (g === "ano") return `${d.getFullYear()}`;
  return `${d.getFullYear()}-${p2(d.getMonth() + 1)}`;
}
function periodos(ini, fim, g) {      // lista de {chave, rotulo, fim}
  const out = [];
  let d = new Date(ini.getFullYear(), ini.getMonth(), ini.getDate());
  if (g === "semana") d = somaDias(d, -((d.getDay() + 6) % 7));
  else if (g === "mes") d = new Date(d.getFullYear(), d.getMonth(), 1);
  else if (g === "trimestre") d = new Date(d.getFullYear(), Math.floor(d.getMonth() / 3) * 3, 1);
  else if (g === "ano") d = new Date(d.getFullYear(), 0, 1);
  while (d <= fim && out.length < 2000) {
    let prox, rot;
    if (g === "dia") { prox = somaDias(d, 1); rot = `${p2(d.getDate())}/${p2(d.getMonth() + 1)}`; }
    else if (g === "semana") { prox = somaDias(d, 7); rot = `${p2(d.getDate())}/${p2(d.getMonth() + 1)}/${String(d.getFullYear()).slice(2)}`; }
    else if (g === "mes") { prox = new Date(d.getFullYear(), d.getMonth() + 1, 1); rot = `${MESES[LANG][d.getMonth()]}/${String(d.getFullYear()).slice(2)}`; }
    else if (g === "trimestre") { prox = new Date(d.getFullYear(), d.getMonth() + 3, 1); rot = `T${Math.floor(d.getMonth() / 3) + 1}/${String(d.getFullYear()).slice(2)}`; }
    else { prox = new Date(d.getFullYear() + 1, 0, 1); rot = String(d.getFullYear()); }
    out.push({ chave: chavePeriodo(d, g), rotulo: rot, ini: d, fim: somaDias(prox, -1) });
    d = prox;
  }
  return out;
}

  const aprovados = pc.map(p => fimRealizado(p) ? base.filter(d => ehAprov(statusEm(d, fimDoDia(p.fim < HOJE ? p.fim : HOJE)))).length : null);
  const ds = [{ label: T("Planejado (data-alvo)"), data: acum("alvo"), borderColor: "#1a73e8", backgroundColor: "#1a73e8", borderWidth: 3, pointRadius: 0, tension: .15 }];
  if (EMI.baseline) ds.push({ label: T("Planejado original (baseline)"), data: acum("prev"), borderColor: "#90a4ae", backgroundColor: "#90a4ae", borderDash: [7, 5], borderWidth: 2.5, pointRadius: 0, tension: .15 });
  ds.push({ label: T("Emitidos (1ª emissão)"), data: emitidos, borderColor: "#fb8c00", backgroundColor: "#fb8c0022", fill: true, borderWidth: 3, pointRadius: 0, tension: .15 });
  if (EMI.aprov) ds.push({ label: T("Aprovados (aprovação total)"), data: aprovados, borderColor: "#1e8e3e", backgroundColor: "#1e8e3e22", fill: true, borderWidth: 3, pointRadius: 0, tension: .15 });
  const iH = indiceHoje(pc);
  grafico("g-curva", { type: "line", data: { labels: pc.map(p => p.rotulo), datasets: ds },
    options: { interaction: { mode: "index", intersect: false }, plugins: { legend: { position: "top" }, linhaHoje: { indice: iH },
        tooltip: { callbacks: { label: c => c.raw == null ? null : `${c.dataset.label}: ${nf(c.raw)}` } },
        datalabels: { display: c => c.dataIndex === (iH >= 0 ? iH : -1) && c.dataset.data[c.dataIndex] != null, align: "left", anchor: "end", offset: 6, color: c => c.dataset.borderColor,
          font: { weight: "bold", size: 13 }, formatter: v => nf(v), backgroundColor: "#ffffffcc", borderRadius: 4, padding: 3 } },
      scales: { x: eixoCat(), y: eixoVal({ title: { display: true, text: T("documentos") } }) }, onHover: cursor,
      onClick: (e, el) => { if (!el.length) return; const p = pc[el[0].index], lbl = ds[el[0].datasetIndex].label;
        const lim = p.fim < HOJE ? p.fim : HOJE;
        const lista = lbl === T("Planejado (data-alvo)") ? base.filter(d => d.alvo && d.alvo >= p.ini && d.alvo <= p.fim)
          : lbl === T("Planejado original (baseline)") ? base.filter(d => d.prev && d.prev >= p.ini && d.prev <= p.fim)
          : lbl === T("Emitidos (1ª emissão)") ? base.filter(d => d.e1 && d.e1 >= p.ini && d.e1 <= lim)
          : base.filter(d => ehAprov(statusEm(d, fimDoDia(lim))));
        abrirDocs(`${lbl} · ${p.rotulo}`, lista); } } });
  const fora = base.filter(d => d.alvo && d.alvo > cf).length;
  const ate = c => base.filter(d => d[c] && d[c] <= HOJE).length;
  document.getElementById("nota-curva").textContent = `${T("Até hoje")} (${fmt(HOJE)}): ${T("Planejado (data-alvo)")} ${nf(ate("alvo"))} · ${T("Planejado original (baseline)")} ${nf(ate("prev"))} · ` +
    `${T("Emitidos (1ª emissão)")} ${nf(ate("e1"))} · ${T("Aprovados (aprovação total)")} ${nf(base.filter(d => ehAprov(statusEm(d, fimDoDia(HOJE)))).length)}. ${T("O ponto de hoje no gráfico soma o período inteiro.")} ` +
    (fora && !EMI.ano ? `${nf(fora)} ${T("documentos com data-alvo depois de")} ${fmt(cf)} ${T("ficam fora do eixo")}.` : "");

  // Próximas emissões e vencidos (pela data-alvo)
  const pend = base.filter(d => d.st === "NÃO EMITIDO" && d.alvo);
  const lista = EMI.lista === "venc" ? pend.filter(d => d.alvo < HOJE).sort((a, b) => a.alvo - b.alvo)
    : pend.filter(d => d.alvo >= HOJE && d.alvo <= somaDias(HOJE, +EMI.lista)).sort((a, b) => a.alvo - b.alvo);
  const tp = document.getElementById("t-prox");
  tp.innerHTML = `<thead><tr><th>${T("Data-alvo")}</th><th>${T("dias")}</th><th>${T("Nº ITAIPU")}</th><th>${T("Descrição")}</th><th>${T("Grupo")}</th><th>${T("Sistema")}</th><th>${T("Responsável")}</th><th>${T("Data prevista")}</th><th>${T("Data reprogramada")}</th></tr></thead><tbody>` +
    (lista.length ? lista.map((d, i) => `<tr class="clic" data-i="${i}"><td class="data"><b>${fmt(d.alvo)}</b></td><td class="num" style="color:${d.alvo < HOJE ? "#d93025" : "#1a73e8"}">${diasEntre(HOJE, d.alvo)}</td>` +
      `<td class="cod">${esc(d.cod)}</td><td class="desc">${esc(d.desc)}</td><td>${esc(d.grupo)}</td><td>${esc(d.sistema)}</td><td>${esc(d.resp)}</td><td class="data">${fmt(d.prev)}</td><td class="data">${fmt(d.rep)}</td></tr>`).join("")
      : `<tr><td colspan="9" class="vazio">${T("Nenhum documento com estes filtros.")}</td></tr>`) + "</tbody>";
  tp.querySelectorAll("tr.clic").forEach(tr => tr.onclick = () => abrirHistoria(lista[+tr.dataset.i]));
}

// =====================================================================
// 3 · Progresso: a tendência, contada pela linha do tempo de cada documento
// =====================================================================
const PRG = { ref: "30", outra: "", janela: "6" };
function dataReferencia() {
  if (PRG.ref === "ano") return new Date(HOJE.getFullYear(), 0, 1);
  if (PRG.ref === "outra" && PRG.outra) return dt(PRG.outra);
  return somaDias(HOJE, -(+PRG.ref || 30));
}
function contagem(docs, data) {
  const st = docs.map(d => statusEm(d, fimDoDia(data)));
  const c = contar(st), n = docs.length;
  const ap = st.filter(ehAprov).length;
  return { n, c, ap, emit: docs.filter(d => d.e1 && d.e1 <= data).length,
    pctAp: n ? 100 * ap / n : 0, docs: (f) => docs.filter((d, i) => f(st[i])) };
}
function pintarProgresso(aba, docs) {
  const base = docs.filter(d => !cancelado(d));
  const ref = dataReferencia(), ultimoAcx = dt(D.meta.ultimoEvento);
  aba.innerHTML = `
    <div class="ctl">
      <label>${T("Comparar com")}<select id="sel-ref">${[["7", "1 semana atrás"], ["14", "2 semanas atrás"], ["30", "1 mês atrás"], ["90", "3 meses atrás"], ["ano", "Início do ano"], ["outra", "Outra data"]].map(([k, r]) => `<option value="${k}"${PRG.ref === k ? " selected" : ""}>${T(r)}</option>`).join("")}</select></label>
      <label${PRG.ref === "outra" ? "" : " hidden"}>${T("Data")}<input type="date" id="inp-ref" value="${PRG.outra}"></label>
    </div>
    <div class="fechas">
      <div class="fecha"><div class="fn">${T("Data de referência")}</div><div class="fd">${fmt(ref)}</div></div><span class="seta">➜</span>
      <div class="fecha ult"><div class="fn">${T("Hoje (base Aconex)")}</div><div class="fd">${fmt(HOJE)}</div></div>
      <div class="fecha dias"><div class="fn">${T("Dias entre as datas")}</div><div class="fd">${nf(diasEntre(ref, HOJE))}</div></div>
      <div class="fecha acx"><div class="fn">${T("Último evento no Aconex")}</div><div class="fd">${fmt(ultimoAcx)}</div></div>
    </div>
    <div class="kpis" id="kpis-prg"></div>
    <div class="resumo" id="resumo-prg"></div>
    <div class="card"><h3>${T("Tendência entre as datas")} ${info("prg-tendencia")} <small>${T("clique em um ponto para ver os documentos")}</small></h3>
      <div class="ctl" style="margin-bottom:8px"><label>${T("Janela")}<span class="seg" id="seg-jan">${[["3", "3 meses"], ["6", "6 meses"], ["12", "12 meses"], ["tudo", "Tudo"]].map(([k, r]) => `<button data-k="${k}"${PRG.janela === k ? ' class="on"' : ""}>${T(r)}</button>`).join("")}</span></label></div>
      <div class="caixa" style="height:420px"><canvas id="g-tend"></canvas></div></div>
    <div class="card"><h3>${T("Evolução da carteira")} ${info("prg-carteira")} <small>${T("estado de cada documento no fim de cada período, reconstruído do histórico do Aconex")}</small></h3><div class="caixa" style="height:360px"><canvas id="g-cart"></canvas></div></div>
    <div class="card"><h3>${T("Histórico por data")} ${info("prg-historico")}</h3><div class="tabela-wrap" style="max-height:460px"><table class="hist" id="t-hist"></table></div></div>
    <div class="card"><h3>${T("O que mudou desde")} ${fmt(ref)} ${info("prg-mudou")}</h3><div class="mudancas" id="mudancas"></div></div>`;
  document.getElementById("sel-ref").onchange = e => { PRG.ref = e.target.value; if (PRG.ref === "outra" && !PRG.outra) PRG.outra = `${ref.getFullYear()}-${p2(ref.getMonth() + 1)}-${p2(ref.getDate())}`; pintar(); };
  const inp = document.getElementById("inp-ref"); if (inp) inp.onchange = e => { PRG.outra = e.target.value; pintar(); };
  document.querySelectorAll("#seg-jan button").forEach(b => b.onclick = () => { PRG.janela = b.dataset.k; pintar(); });

  const A = contagem(base, ref), H = contagem(base, HOJE);
  const delta = (h, a, pp) => { const v = h - a; const cl = v > 0 ? "delta-up" : v < 0 ? "delta-down" : "delta-eq";
    return `<span class="${cl}">${v > 0 ? "▲" : v < 0 ? "▼" : "="} ${pp ? `${v > 0 ? "+" : ""}${dec(v)} pp` : sinal(v)}</span> ${T("vs.")} ${fmt(ref)}`; };
  const deltaInv = (h, a) => { const v = h - a; const cl = v < 0 ? "delta-up" : v > 0 ? "delta-down" : "delta-eq";
    return `<span class="${cl}">${v > 0 ? "▲" : v < 0 ? "▼" : "="} ${sinal(v)}</span> ${T("vs.")} ${fmt(ref)}`; };
  const deltaNeutro = (h, a) => `<span class="delta-eq">${h > a ? "▲" : h < a ? "▼" : "="} ${sinal(h - a)}</span> ${T("vs.")} ${fmt(ref)}`;
  const q = (C, s) => C.c[s] || 0;
  pintarKpis("kpis-prg", [
    [T("Emitidos"), nf(H.emit), "#fb8c00", base.filter(d => d.e1 && d.e1 <= HOJE), delta(H.emit, A.emit)],
    [T("Aprovados"), nf(q(H, "Aprovado")), ST_COR["Aprovado"], H.docs(s => s === "Aprovado"), delta(q(H, "Aprovado"), q(A, "Aprovado"))],
    [T("Com comentários"), nf(q(H, "Aprovado com Comentários")), ST_COR["Aprovado com Comentários"], H.docs(s => s === "Aprovado com Comentários"), delta(q(H, "Aprovado com Comentários"), q(A, "Aprovado com Comentários"))],
    [T("Para assinatura"), nf(q(H, "Para Assinatura")), ST_COR["Para Assinatura"], H.docs(s => s === "Para Assinatura"), delta(q(H, "Para Assinatura"), q(A, "Para Assinatura"))],
    [T("Em processo"), nf(q(H, "Em Processo")), ST_COR["Em Processo"], H.docs(s => s === "Em Processo"), deltaNeutro(q(H, "Em Processo"), q(A, "Em Processo"))],
    [T("Não aprovados"), nf(q(H, "Não Aprovado")), ST_COR["Não Aprovado"], H.docs(s => s === "Não Aprovado"), deltaInv(q(H, "Não Aprovado"), q(A, "Não Aprovado"))],
    [T("% aprovação total"), `${dec(H.pctAp)}%`, "#0b5394", H.docs(ehAprov), delta(H.pctAp, A.pctAp, true), "total"],
  ]);
  // Resumo em palavras (o que o pessoal gostou na aba Progresso da Sala Segura)
  const revs = base.flatMap(d => d.revs);
  const naJanela = (dd) => dd && dd > ref && dd <= HOJE;
  const env = revs.filter(r => naJanela(r.env)), ret = revs.filter(r => naJanela(r.ret));
  const tipos = contar(env.map(r => r.tipo)), retAp = ret.filter(r => ehAprov(r.stRet)).length, retNa = ret.filter(r => r.stRet === "Não Aprovado").length;
  const semanas = Math.max(diasEntre(ref, HOJE) / 7, 1 / 7);
  const ritmo = (H.ap - A.ap) / semanas;
  const txt = LANG === "en"
    ? `In <b>${nf(diasEntre(ref, HOJE))} days</b> (from ${fmt(ref)} to ${fmt(HOJE)}), total approval went from <b>${nf(A.ap)}</b> to <b>${nf(H.ap)}</b> documents (${sinal(H.ap - A.ap)}) and from <b>${dec(A.pctAp)}%</b> to <b>${dec(H.pctAp)}%</b>. ` +
      `Engineering sent <b>${nf(env.length)}</b> submissions to Itaipu: ${nf(tipos["1ª emissão"] || 0)} first issues, ${nf(tipos["Reemissão"] || 0)} reissues and ${nf(tipos["Emissão final"] || 0)} final issues. ` +
      `Itaipu returned <b>${nf(retAp)}</b> approvals and <b>${nf(retNa)}</b> rejections. Not approved went from <b>${nf(q(A, "Não Aprovado"))}</b> to <b>${nf(q(H, "Não Aprovado"))}</b>; documents with Itaipu, from <b>${nf(q(A, "Em Processo"))}</b> to <b>${nf(q(H, "Em Processo"))}</b>. ` +
      `Average pace: <b>${dec(ritmo)} documents approved per week</b>.`
    : `Em <b>${nf(diasEntre(ref, HOJE))} dias</b> (de ${fmt(ref)} a ${fmt(HOJE)}), a aprovação total passou de <b>${nf(A.ap)}</b> para <b>${nf(H.ap)}</b> documentos (${sinal(H.ap - A.ap)}) e de <b>${dec(A.pctAp)}%</b> para <b>${dec(H.pctAp)}%</b>. ` +
      `A engenharia fez <b>${nf(env.length)}</b> envios à Itaipu: ${nf(tipos["1ª emissão"] || 0)} primeiras emissões, ${nf(tipos["Reemissão"] || 0)} reemissões e ${nf(tipos["Emissão final"] || 0)} emissões finais. ` +
      `A Itaipu devolveu <b>${nf(retAp)}</b> aprovações e <b>${nf(retNa)}</b> reprovações. Os não aprovados passaram de <b>${nf(q(A, "Não Aprovado"))}</b> para <b>${nf(q(H, "Não Aprovado"))}</b>, e os documentos com a Itaipu, de <b>${nf(q(A, "Em Processo"))}</b> para <b>${nf(q(H, "Em Processo"))}</b>. ` +
      `Ritmo médio: <b>${dec(ritmo)} documentos aprovados por semana</b>.`;
  document.getElementById("resumo-prg").innerHTML = txt + " " + info("prg-comparacao");

  // Tendência: pontos no fim de cada período da janela
  const meses = PRG.janela === "tudo" ? null : +PRG.janela;
  const primeiro = new Date(Math.min(...base.flatMap(d => d.tl.map(x => x[0])).concat([HOJE])));
  const ini = meses ? new Date(HOJE.getFullYear(), HOJE.getMonth() - meses, HOJE.getDate()) : primeiro;
  const agr = meses && meses <= 6 ? "semana" : "mes";
  const ps = periodos(ini, HOJE, agr).map(p => ({ ...p, fim: p.fim > HOJE ? HOJE : p.fim }));
  const C = ps.map(p => contagem(base, p.fim));
  const series = [["Aprovado", "Aprovados (sem comentários)", ST_COR["Aprovado"]], ["Aprovado com Comentários", "Com comentários", ST_COR["Aprovado com Comentários"]],
    ["Para Assinatura", "Para assinatura", ST_COR["Para Assinatura"]], ["__ap", "Aprovação total", "#0b5394"], ["Não Aprovado", "Não aprovados", ST_COR["Não Aprovado"]],
    ["Em Processo", "Em processo", ST_COR["Em Processo"]]];
  const valor = (c, s) => s === "__ap" ? c.ap : (c.c[s] || 0);
  const ult = ps.length - 1;
  grafico("g-tend", { type: "line", data: { labels: ps.map(p => fmt(p.fim)), datasets: series.map(([s, r, c]) => ({ label: T(r), data: C.map(x => valor(x, s)),
      borderColor: c, backgroundColor: c, borderWidth: s === "__ap" ? 3.5 : 2.5, borderDash: s === "__ap" ? [8, 5] : [], pointRadius: ps.length > 30 ? 0 : 3, pointHoverRadius: 6, tension: .2 })) },
    options: { interaction: { mode: "index", intersect: false }, layout: { padding: { right: 40, top: 10 } },
      plugins: { legend: { position: "top" }, datalabels: { align: "top", color: c => c.dataset.borderColor, font: { weight: "bold", size: 13 }, formatter: v => nf(v),
        // rótulo só nas pontas e só das séries que não se encostam (o resto fica no tooltip)
        display: c => { const s = series[c.datasetIndex][0]; return s === "__ap" ? (c.dataIndex === 0 || c.dataIndex === ult) : (c.dataIndex === ult && (s === "Não Aprovado" || s === "Em Processo")); } } },
      scales: { x: eixoCat(), y: eixoVal() }, onHover: cursor,
      onClick: (e, el) => { if (!el.length) return; const { datasetIndex: k, index: i } = el[0]; const s = series[k][0];
        abrirDocs(`${T(series[k][1])} · ${fmt(ps[i].fim)}`, C[i].docs(x => s === "__ap" ? ehAprov(x) : x === s)); } } });
  // Evolução da carteira (área empilhada), mês a mês desde o início
  const pm = periodos(primeiro, HOJE, "mes").map(p => ({ ...p, fim: p.fim > HOJE ? HOJE : p.fim }));
  const CM = pm.map(p => contagem(base, p.fim));
  const camadas = [["__ap", T("Aprovação total"), "#1e8e3e"], ["Em Processo", T("Em processo"), ST_COR["Em Processo"]], ["Não Aprovado", T("Não aprovados"), ST_COR["Não Aprovado"]], ["NÃO EMITIDO", T("Não emitidos"), "#cfd8dc"]];
  grafico("g-cart", { type: "line", data: { labels: pm.map(p => p.rotulo), datasets: camadas.map(([s, r, c]) => ({ label: r, data: CM.map(x => valor(x, s)), backgroundColor: c, borderColor: "#fff", borderWidth: 1, fill: true, pointRadius: 0, tension: .1 })) },
    options: { interaction: { mode: "index", intersect: false }, plugins: { legend: { position: "top" } }, scales: { x: eixoCat(), y: eixoVal({ stacked: true, max: base.length }) }, onHover: cursor,
      onClick: (e, el) => { if (!el.length) return; const { datasetIndex: k, index: i } = el[0]; const s = camadas[k][0];
        abrirDocs(`${camadas[k][1]} · ${pm[i].rotulo}`, CM[i].docs(x => s === "__ap" ? ehAprov(x) : x === s)); } } });
  // Histórico por data (tabela, como o "Histórico por revisão" da Sala Segura)
  const th = document.getElementById("t-hist");
  th.innerHTML = `<thead><tr><th>${T("Data")}</th><th>${T("Total")}</th><th>${T("Aprovados")}</th><th>${T("Com comentários")}</th><th>${T("Para assinatura")}</th><th>${T("Aprov. total (%)")}</th><th>${T("Não aprovados")}</th><th>${T("Em processo")}</th><th>${T("Não emitidos")}</th><th>${T("Emitidos (acum.)")}</th></tr></thead><tbody>` +
    [...ps.map((p, i) => [p.fim, C[i]])].reverse().map(([d, c]) => `<tr><td><b>${fmt(d)}</b></td><td>${nf(c.n)}</td><td>${nf(c.c["Aprovado"] || 0)}</td><td>${nf(c.c["Aprovado com Comentários"] || 0)}</td><td>${nf(c.c["Para Assinatura"] || 0)}</td>` +
      `<td class="aprt">${nf(c.ap)} (${dec(c.pctAp)}%)</td><td>${nf(c.c["Não Aprovado"] || 0)}</td><td>${nf(c.c["Em Processo"] || 0)}</td><td>${nf(c.c["NÃO EMITIDO"] || 0)}</td><td>${nf(c.emit)}</td></tr>`).join("") + "</tbody>";
  // O que mudou
  const antes = base.map(d => statusEm(d, fimDoDia(ref))), agora = base.map(d => statusEm(d, fimDoDia(HOJE)));
  const grupos = [
    [T("Novas aprovações"), "#1e8e3e", base.filter((d, i) => ehAprov(agora[i]) && !ehAprov(antes[i]))],
    [T("Novas reprovações"), "#d93025", base.filter((d, i) => agora[i] === "Não Aprovado" && antes[i] !== "Não Aprovado")],
    [T("Novas 1ªs emissões"), "#fb8c00", base.filter(d => d.e1 && d.e1 > ref && d.e1 <= HOJE)],
    [T("Entraram em análise na Itaipu"), "#f9a825", base.filter((d, i) => agora[i] === "Em Processo" && antes[i] !== "Em Processo")],
    [T("Saíram de aprovado"), "#6d4c41", base.filter((d, i) => ehAprov(antes[i]) && !ehAprov(agora[i]))],
  ];
  const mb = document.getElementById("mudancas");
  mb.innerHTML = grupos.map(([t, c, l], i) => `<button class="mud" style="--c:${c}" data-i="${i}"><div class="mt">${t}</div><div class="mv">${nf(l.length)}</div><small>${T("documentos")}</small></button>`).join("");
  mb.querySelectorAll(".mud").forEach(b => b.onclick = () => { const [t, , l] = grupos[+b.dataset.i]; if (l.length) abrirDocs(`${t} · ${fmt(ref)} → ${fmt(HOJE)}`, l); });
}

// =====================================================================
// 4 · Esforço da engenharia: envios à Itaipu, retornos e retrabalho
// =====================================================================
const ESF = { ano: "", agr: "mes", corte: "" };
const corteInicial = () => new Date(HOJE.getFullYear(), HOJE.getMonth() - 3, 1);   // 1º dia de 3 meses atrás
function pintarEsforco(aba, docs) {
  const base = docs.filter(d => !cancelado(d)), revs = base.flatMap(d => d.revs);
  const anos = unicos(revs.flatMap(r => [r.env, r.ret]).filter(Boolean).map(d => d.getFullYear())).sort();
  if (ESF.ano && !anos.includes(+ESF.ano)) ESF.ano = "";
  aba.innerHTML = `
    <div class="ctl">
      <label>${T("Ano")}<select id="esf-ano"><option value="">${T("Todos")}</option>${anos.map(a => `<option${String(a) === ESF.ano ? " selected" : ""}>${a}</option>`).join("")}</select></label>
      <label>${T("Agrupar por")}<span class="seg" id="esf-agr">${[["semana", "Semana"], ["mes", "Mês"], ["trimestre", "Trimestre"]].map(([k, r]) => `<button data-k="${k}"${ESF.agr === k ? ' class="on"' : ""}>${T(r)}</button>`).join("")}</span></label>
    </div>
    <div class="kpis" id="kpis-esf"></div>
    <div class="card"><h3>${T("Antes e depois de uma data")} ${info("esf-antes-depois")} <small>${T("mesma duração antes e depois · contagens por mês")}</small></h3>
      <div class="ctl" style="margin-bottom:10px"><label>${T("Data de corte")}<input type="date" id="esf-corte" value="${ESF.corte || iso(corteInicial())}"></label></div>
      <div class="tabela-wrap"><table class="hist" id="t-ad"></table></div><p class="nota" id="nota-ad"></p></div>
    <div class="fila-meio">

  document.getElementById("esf-ano").onchange = e => { ESF.ano = e.target.value; pintar(); };
  document.getElementById("esf-corte").onchange = e => { ESF.corte = e.target.value; pintar(); };
  pintarAntesDepois(base, revs);

  const datas = revs.flatMap(r => [r.env, r.ret]).filter(Boolean);
  if (!datas.length) return;
  const ini = ESF.ano ? new Date(+ESF.ano, 0, 1) : new Date(Math.min(...datas)), fim = ESF.ano ? new Date(+ESF.ano, 11, 31) : HOJE;
  const dentro = d => d && d >= ini && d <= fim;
  const env = revs.filter(r => dentro(r.env)), ret = revs.filter(r => dentro(r.ret));
  const ps = periodos(ini, fim > HOJE ? HOJE : fim, ESF.agr), idx = Object.fromEntries(ps.map((p, i) => [p.chave, i]));
  // Aprovados de primeira e revisões até aprovar (sobre todo o histórico de cada documento)
  const comRet = base.filter(d => d.revs.some(r => r.stRet));
  const primeiraAp = comRet.filter(d => ehAprov(d.revs.find(r => r.stRet).stRet));
  const aprovEm = base.map(d => { const k = d.revs.findIndex(r => ehAprov(r.stRet)); return k < 0 ? null : { d, rev: d.revs[k].rev, n: d.revs.slice(0, k + 1).filter(r => r.env).length }; }).filter(Boolean);
  const tipos = contar(env.map(r => r.tipo));
  pintarKpis("kpis-esf", [
    [T("Envios à Itaipu"), nf(env.length), "#37474f", null, T("no período")],
    [T("1ªs emissões"), nf(tipos["1ª emissão"] || 0), TIPO_COR["1ª emissão"], null, pct(tipos["1ª emissão"] || 0, env.length)],
    [T("Reemissões"), nf(tipos["Reemissão"] || 0), TIPO_COR["Reemissão"], null, pct(tipos["Reemissão"] || 0, env.length)],
    [T("Emissões finais"), nf(tipos["Emissão final"] || 0), TIPO_COR["Emissão final"], null, pct(tipos["Emissão final"] || 0, env.length)],
    [T("Documentos trabalhados"), nf(unicos(env.map(r => r.doc.i)).length), "#00897b", unicos(env.map(r => r.doc)), T("no período")],
    [T("Retornos da Itaipu"), nf(ret.length), "#3949ab", null, T("no período")],
    [T("Aprovados de primeira"), pct(primeiraAp.length, comRet.length), "#1e8e3e", primeiraAp, `${nf(primeiraAp.length)} ${T("de")} ${nf(comRet.length)} ${T("dos documentos com retorno")}`],
    [T("Revisões até aprovar (média)"), dec(media(aprovEm.map(x => x.n))), "#8e24aa", null, ""],

  document.querySelectorAll("#kpis-esf .kpi").forEach((el, i) => { if ([0, 1, 2, 3, 5].includes(i)) { el.classList.remove("nohand"); el.onclick = () => abrirRevs(el.querySelector(".kt").textContent, i === 5 ? ret : i === 0 ? env : env.filter(r => r.tipo === TIPO_ORDEM[i - 1])); } });
  // Envios por período e tipo
  const gEnv = TIPO_ORDEM.map(() => ps.map(() => []));
  env.forEach(r => { const i = idx[chavePeriodo(r.env, ESF.agr)]; if (i != null) gEnv[Math.max(0, TIPO_ORDEM.indexOf(r.tipo))][i].push(r); });
  grafico("g-env", { type: "bar", data: { labels: ps.map(p => p.rotulo), datasets: TIPO_ORDEM.map((t, k) => ({ label: TS(t), data: gEnv[k].map(a => a.length), backgroundColor: TIPO_COR[t], stack: "s" })) },
    options: { plugins: { legend: { position: "bottom" }, tooltip: { mode: "index", intersect: false, callbacks: { footer: it => `${T("Total")}: ${nf(it.reduce((s, x) => s + x.raw, 0))}` } } },
      scales: { x: eixoCat({ stacked: true }), y: eixoVal({ stacked: true }) }, onHover: cursor,
      onClick: (e, el) => { if (!el.length) return; const { datasetIndex: k, index: i } = el[0]; abrirRevs(`${TS(TIPO_ORDEM[k])} · ${ps[i].rotulo}`, gEnv[k][i]); } } });
  // Retornos por status
  const rcat = s => RET_ORDEM.includes(s) ? s : "Outros";
  const cats = [...RET_ORDEM, "Outros"].filter(c => ret.some(r => rcat(r.stRet) === c));
  const gRet = cats.map(() => ps.map(() => []));
  ret.forEach(r => { const i = idx[chavePeriodo(r.ret, ESF.agr)]; if (i != null) gRet[cats.indexOf(rcat(r.stRet))][i].push(r); });
  grafico("g-ret", { type: "bar", data: { labels: ps.map(p => p.rotulo), datasets: cats.map((c, k) => ({ label: TS(c), data: gRet[k].map(a => a.length), backgroundColor: ST_COR[c] || "#8d6e63", stack: "s" })) },
    options: { plugins: { legend: { position: "bottom" }, tooltip: { mode: "index", intersect: false } }, scales: { x: eixoCat({ stacked: true }), y: eixoVal({ stacked: true }) }, onHover: cursor,
      onClick: (e, el) => { if (!el.length) return; const { datasetIndex: k, index: i } = el[0]; abrirRevs(`${TS(cats[k])} · ${ps[i].rotulo}`, gRet[k][i]); } } });
  // Em que revisão foi aprovado
  const bucket = r => /^\d+$/.test(r) ? r : (r.length === 2 && r[0] === "0" && "ABCD".includes(r[1])) ? r : (r[0] === "0" ? "0E+" : `${r[0]}x`);
  const bk = contar(aprovEm.map(x => bucket(x.rev)));
  const ordemB = Object.keys(bk).sort((a, b) => { const o = ["0A", "0B", "0C", "0D", "0E+", "0"]; return (o.indexOf(a) < 0 ? 99 : o.indexOf(a)) - (o.indexOf(b) < 0 ? 99 : o.indexOf(b)) || a.localeCompare(b); });
  grafico("g-ciclos", { type: "bar", data: { labels: ordemB, datasets: [{ data: ordemB.map(b => bk[b]), backgroundColor: ordemB.map(b => b === "0A" ? "#1e8e3e" : b === "0B" ? "#7cb342" : b === "0C" ? "#fbc02d" : b === "0D" ? "#fb8c00" : "#d93025"), borderRadius: 6 }] },
    options: { layout: { padding: { top: 26 } }, plugins: { legend: { display: false }, datalabels: { display: true, anchor: "end", align: "end", font: { weight: "bold" }, formatter: v => `${nf(v)} (${pct(v, aprovEm.length)})` } },
      scales: { x: eixoCat(), y: eixoVal() }, onHover: cursor,
      onClick: (e, el) => { if (el.length) { const b = ordemB[el[0].index]; abrirDocs(`${T("Em que revisão o documento foi aprovado")}: ${b}`, aprovEm.filter(x => bucket(x.rev) === b).map(x => x.d)); } } } });
  // Os três gráficos de % (sem eixo duplo: o % no eixo; quantos de quantos e a mediana no tooltip).
  // Prazo de análise da Itaipu: retornos pela data do retorno, com os dias de análise conhecidos.
  // Prazo de reemissão da CMI: reemissões depois de reprovação, pela data do envio.
  // Taxa de aprovação: retornos que foram aprovação ou reprovação, pela data do retorno.
  const rpT = ps.map((p, i) => gRet.flatMap(g => g[i]).filter(r => r.dIt != null && r.sla));
  const posRepT = ps.map(p => env.filter(r => r.antSt === "Não Aprovado" && r.dCmi != null && r.env >= p.ini && r.env <= p.fim));
  const retPT = ps.map((p, i) => gRet.flatMap(g => g[i]).filter(r => ehAprov(r.stRet) || r.stRet === "Não Aprovado"));
  // Período com poucos casos não vira ponto: com 3 ou 4 casos a linha pula entre 0% e 100% sem
  // querer dizer nada. O eixo dos três começa no primeiro período com ponto em algum deles, igual
  // nos três, para comparar um embaixo do outro.
  const MIN = ESF.agr === "semana" ? 5 : 10;
  const vale = a => a.length >= MIN;
  let k0 = Math.min(...[rpT, posRepT, retPT].map(l => { const k = l.findIndex(vale); return k < 0 ? ps.length : k; }));
  if (k0 >= ps.length) k0 = 0;
  const psP = ps.slice(k0), rp = rpT.slice(k0), posRep = posRepT.slice(k0), retP = retPT.slice(k0);
  const rotN = (a, x, txt) => `${dec(100 * x / a.length)}% · ${nf(x)} ${T("de")} ${nf(a.length)} ${txt}`;
  grafico("g-sla", { type: "line", data: { labels: psP.map(p => p.rotulo), datasets: [{ label: "%", data: rp.map(a => vale(a) ? 100 * a.filter(r => r.dIt <= r.sla).length / a.length : null),
      borderColor: "#3949ab", backgroundColor: "#3949ab", borderWidth: 2.5, pointRadius: 3, spanGaps: true, tension: .2 }] },
    options: { plugins: { legend: { display: false }, tooltip: { callbacks: { label: c => { const a = rp[c.dataIndex];
        return [rotN(a, a.filter(r => r.dIt <= r.sla).length, T("no prazo")), `${T("mediana")}: ${dec(mediana(a.map(r => r.dIt)), 0)} ${T("dias")}`]; } } } },
      scales: { x: eixoCat(), y: eixoVal({ max: 100, ticks: { callback: v => v + "%" } }) }, onHover: cursor,
      onClick: (e, el) => { if (el.length) abrirRevs(`${T("Prazo de análise da Itaipu")} · ${psP[el[0].index].rotulo}`, rp[el[0].index]); } } });
  grafico("g-reem", { type: "line", data: { labels: psP.map(p => p.rotulo), datasets: [{ label: "%", data: posRep.map(a => vale(a) ? 100 * a.filter(r => r.dCmi <= 15).length / a.length : null),
      borderColor: "#fb8c00", backgroundColor: "#fb8c00", borderWidth: 2.5, pointRadius: 3, spanGaps: true, tension: .2 }] },
    options: { plugins: { legend: { display: false }, tooltip: { callbacks: { label: c => { const a = posRep[c.dataIndex];
        return [rotN(a, a.filter(r => r.dCmi <= 15).length, T("em até 15 dias")), `${T("mediana")}: ${dec(mediana(a.map(r => r.dCmi)), 0)} ${T("dias")}`]; } } } },
      scales: { x: eixoCat(), y: eixoVal({ max: 100, ticks: { callback: v => v + "%" } }) }, onHover: cursor,
      onClick: (e, el) => { if (el.length) abrirRevs(`${T("Prazo de reemissão da CMI")} · ${psP[el[0].index].rotulo}`, posRep[el[0].index]); } } });
  grafico("g-taxa", { type: "line", data: { labels: psP.map(p => p.rotulo), datasets: [{ label: "%", data: retP.map(a => vale(a) ? 100 * a.filter(r => ehAprov(r.stRet)).length / a.length : null),
      borderColor: "#1e8e3e", backgroundColor: "#1e8e3e", borderWidth: 2.5, pointRadius: 3, spanGaps: true, tension: .2 }] },
    options: { plugins: { legend: { display: false }, tooltip: { callbacks: { label: c => { const a = retP[c.dataIndex];
        return [rotN(a, a.filter(r => ehAprov(r.stRet)).length, T("aprovados")), `${nf(a.filter(r => r.stRet === "Não Aprovado").length)} ${T("não aprovados")}`]; } } } },
      scales: { x: eixoCat(), y: eixoVal({ max: 100, ticks: { callback: v => v + "%" } }) }, onHover: cursor,
      onClick: (e, el) => { if (el.length) abrirRevs(`${T("Taxa de aprovação dos retornos")} · ${psP[el[0].index].rotulo}`, retP[el[0].index]); } } });
  // Aging (como o "Tempo desde a última modificação" do RTA)
  const faixas = [["Até 15 dias", 0, 15, "#1e8e3e"], ["16 a 30 dias", 16, 30, "#fbc02d"], ["31 a 60 dias", 31, 60, "#fb8c00"], ["Mais de 60 dias", 61, 1e9, "#d93025"]];
  const aging = (lista, ref) => faixas.map(([, a, b]) => lista.filter(d => { const x = ref(d); return x != null && x >= a && x <= b; }));
  const ultEnvio = d => { const r = [...d.revs].reverse().find(x => x.env); return r ? diasEntre(r.env, HOJE) : null; };
  const ultRet = d => { const r = [...d.revs].reverse().find(x => x.ret); return r ? diasEntre(r.ret, HOJE) : null; };
  const emProc = base.filter(d => d.st === "Em Processo"), naoAp = base.filter(d => d.st === "Não Aprovado");
  pizza("g-aging-it", faixas.map(f => T(f[0])), aging(emProc, ultEnvio), faixas.map(f => f[3]), T("Com a Itaipu"));
  pizza("g-aging-cmi", faixas.map(f => T(f[0])), aging(naoAp, ultRet), faixas.map(f => f[3]), T("Com a CMI (reemitir)"));
  // Envios por responsável
  const respDe = r => r.doc.resp || "—";
  const resps = Object.entries(contar(env.map(respDe))).sort((a, b) => b[1] - a[1]).map(x => x[0]).slice(0, 15);
  document.getElementById("cx-resp").style.height = Math.max(220, resps.length * 34 + 70) + "px";
  grafico("g-resp", { type: "bar", data: { labels: resps, datasets: TIPO_ORDEM.map(t => ({ label: TS(t), data: resps.map(p => env.filter(r => respDe(r) === p && r.tipo === t).length), backgroundColor: TIPO_COR[t], stack: "s" })) },
    options: { indexAxis: "y", plugins: { legend: { position: "top" }, tooltip: { mode: "index", intersect: false } }, scales: { x: eixoVal({ stacked: true }), y: { stacked: true, grid: { display: false } } }, onHover: cursor,
      onClick: (e, el) => { if (!el.length) return; const p = resps[el[0].index], t = TIPO_ORDEM[el[0].datasetIndex]; abrirRevs(`${p} · ${TS(t)}`, env.filter(r => respDe(r) === p && r.tipo === t)); } } });
}

// Antes e depois de uma data: duas janelas de mesma duração, para ver se algo melhorou
function pintarAntesDepois(base, revs) {
  const corte = ESF.corte ? dt(ESF.corte) : corteInicial();
  const dur = Math.max(1, diasEntre(corte, HOJE) + 1);
  const W = [{ a: somaDias(corte, -dur), b: somaDias(corte, -1) }, { a: corte, b: HOJE }];
  const medir = w => {
    const dentro = x => x && x >= w.a && x <= w.b, porMes = n => n * 30.4 / dur;
    const env = revs.filter(r => dentro(r.env)), ret = revs.filter(r => dentro(r.ret));
    const ap = ret.filter(r => ehAprov(r.stRet)), na = ret.filter(r => r.stRet === "Não Aprovado");
    const posRep = env.filter(r => r.antSt === "Não Aprovado" && r.dCmi != null), it = ret.filter(r => r.dIt != null && r.sla);
    const ini = base.map(d => statusEm(d, fimDoDia(somaDias(w.a, -1)))), fim = base.map(d => statusEm(d, fimDoDia(w.b)));
    const tipo = t => env.filter(r => r.tipo === t);
    return {
      reem: [porMes(tipo("Reemissão").length), tipo("Reemissão")], prim: [porMes(tipo("1ª emissão").length), tipo("1ª emissão")],
      fin: [porMes(tipo("Emissão final").length), tipo("Emissão final")], ap: [porMes(ap.length), ap],
      taxa: [ap.length + na.length ? 100 * ap.length / (ap.length + na.length) : null, [...ap, ...na]],
      novos: [porMes(fim.filter(ehAprov).length - ini.filter(ehAprov).length), base.filter((d, i) => ehAprov(fim[i]) && !ehAprov(ini[i]))],
      medCmi: [mediana(posRep.map(r => r.dCmi)), posRep], p15: [posRep.length ? 100 * posRep.filter(r => r.dCmi <= 15).length / posRep.length : null, posRep],
      medIt: [mediana(it.map(r => r.dIt)), it], pIt: [it.length ? 100 * it.filter(r => r.dIt <= r.sla).length / it.length : null, it],
      naFim: [fim.filter(s => s === "Não Aprovado").length, base.filter((d, i) => fim[i] === "Não Aprovado")],
    };
  };
  const [A, B] = W.map(medir);
  const linhas = [  // [rótulo, chave, formato, maior é melhor, lista é de revisões]
    ["Reemissões enviadas (por mês)", "reem", "n", true, true], ["1ªs emissões (por mês)", "prim", "n", true, true],
    ["Emissões finais (por mês)", "fin", "n", true, true], ["Retornos aprovados (por mês)", "ap", "n", true, true],
    ["Taxa de aprovação dos retornos", "taxa", "%", true, true], ["Documentos que passaram a aprovados (por mês)", "novos", "n", true, false],
    ["Dias para reemitir depois da reprovação (mediana)", "medCmi", "d", false, true], ["Reemitidos em até 15 dias", "p15", "%", true, true],
    ["Dias de análise da Itaipu (mediana)", "medIt", "d", false, true], ["Itaipu no prazo", "pIt", "%", true, true],
    ["Não aprovados aguardando reemissão (no fim da janela)", "naFim", "i", false, false]];
  const f = (v, k) => v == null ? "—" : k === "%" ? `${dec(v)}%` : k === "d" ? `${dec(v, 0)} ${T("dias")}` : k === "i" ? nf(v) : dec(v);
  const varia = (a, b, k, maior) => {
    if (a == null || b == null) return "—";
    const v = b - a, eps = k === "%" ? 0.5 : k === "i" ? 0 : 0.05;
    const cl = Math.abs(v) <= eps ? "delta-eq" : (v > 0) === maior ? "delta-up" : "delta-down";
    const txt = k === "%" ? `${v > 0 ? "+" : ""}${dec(v)} pp` : k === "d" ? `${v > 0 ? "+" : ""}${dec(v, 0)}` : `${v > 0 ? "+" : ""}${dec(v, k === "i" ? 0 : 1)}`;
    return `<span class="${cl}">${Math.abs(v) <= eps ? "=" : v > 0 ? "▲" : "▼"} ${txt}</span>`;
  };
  const t = document.getElementById("t-ad");
  const rotJ = w => `${fmt(w.a)} – ${fmt(w.b)}`;
  t.innerHTML = `<thead><tr><th>${T("Indicador")}</th><th>${T("Antes")}<br><small>${rotJ(W[0])}</small></th><th>${T("Depois")}<br><small>${rotJ(W[1])}</small></th><th>${T("Variação")}</th></tr></thead><tbody>` +
    linhas.map(([r, k, fm, maior], i) => `<tr class="clic" data-i="${i}"><td style="text-align:left"><b>${T(r)}</b></td><td>${f(A[k][0], fm)}</td><td>${f(B[k][0], fm)}</td><td>${varia(A[k][0], B[k][0], fm, maior)}</td></tr>`).join("") + "</tbody>";
  t.querySelectorAll("tr.clic").forEach(tr => tr.onclick = () => { const [r, k, , , ehRev] = linhas[+tr.dataset.i];
    const titulo = `${T(r)} · ${T("Depois")} (${rotJ(W[1])})`; ehRev ? abrirRevs(titulo, B[k][1]) : abrirDocs(titulo, B[k][1]); });
  document.getElementById("nota-ad").textContent = `${nf(dur)} ${T("dias em cada janela.")} ${T("Clique numa linha para ver os documentos de depois da data.")} ` +
    T("Quando a equipe reemite documentos parados há muito tempo, a mediana de dias para reemitir sobe: leia junto com os não aprovados aguardando.");
}

// =====================================================================
// 5 · Histórico de revisões (como o Histórico Consolidado do DocManager)
// =====================================================================
const HIS = { aberto: false, atrIt: false, atrCmi: false };
function pintarHistorico(aba, docs) {
  const base = docs.filter(d => !cancelado(d));
  let revs = base.flatMap(d => d.revs);
  const sinteticas = base.filter(d => !d.revs.length).map(d => ({ doc: d, rev: "", tipo: T("Não emitido"), env: null, ret: null, stRet: null, sla: null, dIt: null, aIt: null,
    dCmi: null, aCmi: d.alvo && d.alvo < HOJE ? diasEntre(d.alvo, HOJE) : (d.alvo ? 0 : null), ordem: 0 }));
  const abertos = revs.filter(r => r.env && !r.ret && r.dIt != null);
  const comIt = revs.filter(r => r.dIt != null && r.ret), comCmi = revs.filter(r => r.dCmi != null && r.tipo !== "1ª emissão");
  aba.innerHTML = `
    <div class="kpis" id="kpis-his"></div>
    <div class="card"><h3>${T("Histórico de revisões")} ${info("his-tabela")}</h3><p class="nota" style="margin:0 0 10px">${T("Uma linha por revisão, como no Histórico Consolidado do DocManager. Clique em uma linha para ver a história do documento.")} ${T("Os não emitidos entram com uma linha só, como no Histórico Consolidado: o atraso da CMI corre desde a data-alvo.")}</p>
      <div class="ctl" style="margin-bottom:10px"><label class="chk"><input type="checkbox" id="h-ab"${HIS.aberto ? " checked" : ""}> ${T("Só sem retorno")}</label>
        <label class="chk"><input type="checkbox" id="h-it"${HIS.atrIt ? " checked" : ""}> ${T("Só com atraso da Itaipu")}</label>
        <label class="chk"><input type="checkbox" id="h-cmi"${HIS.atrCmi ? " checked" : ""}> ${T("Só com atraso da CMI")}</label>
        <button class="btn-exp" id="h-lista">📄 ${T("Exportar Excel")}</button></div>
      <div class="tabela-wrap" style="max-height:640px"><table id="t-revs"></table></div><div class="mais" id="h-mais"></div></div>`;
  pintarKpis("kpis-his", [
    [T("Revisões (ciclos)"), nf(revs.length), "#37474f", null, ""],
    [T("Em análise agora"), nf(abertos.length), "#f9a825", null, T("Com a Itaipu")],
    [T("Dias Itaipu (média)"), dec(media(comIt.map(r => r.dIt))), "#3949ab", null, `${T("mediana")}: ${dec(mediana(comIt.map(r => r.dIt)), 0)} ${T("dias")}`],
    [T("Itaipu no prazo"), pct(comIt.filter(r => r.aIt === 0).length, comIt.length), "#00897b", null, ""],
    [T("Dias CMI p/ reemitir (média)"), dec(media(comCmi.map(r => r.dCmi))), "#fb8c00", null, `${T("mediana")}: ${dec(mediana(comCmi.map(r => r.dCmi)), 0)} ${T("dias")}`],
    [T("CMI no prazo"), pct(comCmi.filter(r => r.aCmi === 0).length, comCmi.length), "#1e8e3e", null, ""],
  ]);
  document.querySelectorAll("#kpis-his .kpi").forEach((el, i) => { if (i === 1) { el.classList.remove("nohand"); el.onclick = () => abrirRevs(T("Em análise agora"), abertos); } });
  let linhas = [...revs, ...sinteticas];
  if (HIS.aberto) linhas = linhas.filter(r => r.env && !r.ret);
  if (HIS.atrIt) linhas = linhas.filter(r => r.aIt > 0);
  if (HIS.atrCmi) linhas = linhas.filter(r => r.aCmi > 0);
  linhas.sort((a, b) => a.doc.i - b.doc.i || a.ordem - b.ordem);
  document.getElementById("h-ab").onchange = e => { HIS.aberto = e.target.checked; pintar(); };
  document.getElementById("h-it").onchange = e => { HIS.atrIt = e.target.checked; pintar(); };
  document.getElementById("h-cmi").onchange = e => { HIS.atrCmi = e.target.checked; pintar(); };
  document.getElementById("h-lista").onclick = () => abrirRevs(T("Histórico de revisões"), linhas);
  const cols = COLS_REV(), max = 1200;
  const t = document.getElementById("t-revs");
  t.innerHTML = `<thead><tr>${cols.map(([h]) => `<th>${esc(h)}</th>`).join("")}</tr></thead><tbody>` +
    linhas.slice(0, max).map((r, i) => `<tr class="clic" data-i="${i}">${cols.map(([, f, k]) => k === "tipo" ? `<td>${r.tipo ? chip(r.tipo, TIPO_COR[r.tipo] || "#9aa0a6") : "—"}</td>` : celula(f(r), k)).join("")}</tr>`).join("") + "</tbody>";
  document.getElementById("h-mais").textContent = linhas.length > max ? `${T("mostrando as primeiras")} ${nf(max)} ${T("linhas")} · ${nf(linhas.length)}` : "";
  t.querySelectorAll("tr.clic").forEach(tr => tr.onclick = () => abrirHistoria(linhas[+tr.dataset.i].doc));
}

// =====================================================================
// História do documento: linha do tempo com o plano, cada revisão e o status
// =====================================================================
function abrirHistoria(d) {
  const m = document.getElementById("modal");
  const datas = [d.prev, d.rep, d.alvo, HOJE, ...d.revs.flatMap(r => [r.env, r.ret]), ...d.tl.map(x => x[0])].filter(Boolean);
  const ini = somaDias(new Date(Math.min(...datas)), -20), fim = somaDias(new Date(Math.max(...datas)), 25);
  const W = 1180, esq = 70, dir = 20, larg = W - esq - dir, span = Math.max(1, diasEntre(ini, fim));
  const X = data => esq + larg * diasEntre(ini, data) / span;
  const altRev = 34, topo = 46, nRev = d.revs.length;
  const yStatus = topo + Math.max(nRev, 1) * altRev + 26, H = yStatus + 60;
  let svg = `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" font-family="Segoe UI, Arial" font-size="12">`;
  // grade mensal
  for (let dd = new Date(ini.getFullYear(), ini.getMonth() + 1, 1); dd <= fim; dd = new Date(dd.getFullYear(), dd.getMonth() + 1, 1)) {
    const x = X(dd); svg += `<line x1="${x}" y1="${topo - 14}" x2="${x}" y2="${H - 28}" stroke="#eceff1"/>`;
    if (dd.getMonth() % (span > 900 ? 3 : 1) === 0) svg += `<text x="${x + 3}" y="${H - 14}" fill="#78909c">${MESES[LANG][dd.getMonth()]}/${String(dd.getFullYear()).slice(2)}</text>`;
  }
  // plano
  const marco = (data, rot, cor, forma) => { if (!data) return ""; const x = X(data);
    return `<line x1="${x}" y1="${topo - 16}" x2="${x}" y2="${H - 28}" stroke="${cor}" stroke-dasharray="4 3"/>` +
      (forma === "losango" ? `<path d="M${x} ${topo - 34} l7 7 l-7 7 l-7 -7 z" fill="${cor}"/>` : `<circle cx="${x}" cy="${topo - 27}" r="6" fill="#fff" stroke="${cor}" stroke-width="3"/>`) +
      (x > W - 190 ? `<text x="${x - 10}" y="${topo - 22}" text-anchor="end" fill="${cor}" font-weight="700">${esc(rot)} ${fmt(data)}</text>`
        : `<text x="${x + 10}" y="${topo - 22}" fill="${cor}" font-weight="700">${esc(rot)} ${fmt(data)}</text>`); };
  svg += marco(d.prev, T("Prevista"), "#607d8b", "losango");
  if (d.rep) svg += marco(d.rep, T("Reprogramada"), "#8e24aa", "circulo");
  const xh = X(HOJE); svg += `<line x1="${xh}" y1="${topo - 16}" x2="${xh}" y2="${H - 28}" stroke="#263238" stroke-width="1.5"/><text x="${xh - 4}" y="${H - 30}" text-anchor="end" fill="#263238" font-weight="700">${T("Hoje")}</text>`;
  // revisões: com a Itaipu (envio → retorno) e com a CMI (retorno → próximo envio)
  d.revs.forEach((r, k) => {
    const y = topo + k * altRev;
    svg += `<text x="${esq - 8}" y="${y + 15}" text-anchor="end" font-weight="700" fill="#37474f">${esc(r.rev)}</text>`;
    if (r.env) {
      const fimIt = r.ret || HOJE, cor = r.ret ? (ST_COR[r.stRet] || "#8d6e63") : "#f9a825";
      const x1 = X(r.env), x2 = Math.max(X(fimIt), x1 + 3);
      svg += `<rect x="${x1}" y="${y + 4}" width="${x2 - x1}" height="16" rx="4" fill="${cor}"><title>${esc(r.rev)} · ${T("com a Itaipu")}: ${fmt(r.env)} → ${r.ret ? fmt(r.ret) : T("em análise (sem retorno)")} (${r.dIt ?? "—"} ${T("dias")})${r.stRet ? " · " + esc(TS(r.stRet)) : ""}</title></rect>`;
      svg += `<text x="${x2 + 5}" y="${y + 16}" fill="#455a64">${r.ret ? esc(TS(r.stRet)) : T("em análise (sem retorno)")} · ${r.dIt ?? "—"}d</text>`;
    }
    const prox = d.revs.slice(k + 1).find(x => x.env);
    if (r.ret && prox && prox.env > r.ret) {
      const x1 = X(r.ret), x2 = X(prox.env);
      svg += `<rect x="${x1}" y="${y + 24}" width="${Math.max(2, x2 - x1)}" height="6" rx="3" fill="${r.stRet === "Não Aprovado" ? "#ef9a9a" : "#b0bec5"}"><title>${T("com a CMI")}: ${fmt(r.ret)} → ${fmt(prox.env)} (${diasEntre(r.ret, prox.env)} ${T("dias")})</title></rect>`;
    }
  });
  // faixa do status real ao longo do tempo
  svg += `<text x="${esq - 8}" y="${yStatus + 14}" text-anchor="end" font-weight="700" fill="#37474f">${T("Status")}</text>`;
  const pts = d.tl.length ? d.tl : [];
  if (!pts.length) svg += `<rect x="${esq}" y="${yStatus}" width="${larg}" height="20" rx="4" fill="${ST_COR["NÃO EMITIDO"]}"><title>${T("Não emitido")}</title></rect>`;
  pts.forEach(([dd, s], k) => {
    const x1 = X(dd), x2 = X(k + 1 < pts.length ? pts[k + 1][0] : HOJE);
    svg += `<rect x="${x1}" y="${yStatus}" width="${Math.max(2, x2 - x1)}" height="20" fill="${corSt(s)}"><title>${esc(TS(s))}: ${fmt(dd)}</title></rect>`;
  });
  svg += `</svg>`;
  const usados = unicos([...d.revs.map(r => r.stRet).filter(Boolean), ...d.tl.map(x => x[1])]);
  m.innerHTML = `<div class="janela">
    <div class="jan-head"><div style="flex:1"><h2>${T("História do documento")} ${info("his-historia")}</h2>
      <div class="jan-cods"><span class="cod-chip ita">${esc(d.cod)}</span>${d.codAtual && d.codAtual !== d.cod ? `<span class="cod-chip ita">${esc(d.codAtual)}</span>` : ""}<span class="cod-chip">${esc(d.cmi)}</span>${d.trk ? `<span class="cod-chip">Tracking ${esc(d.trk)}</span>` : ""}${chip(d.st, corSt(d.st))}${d.sit ? chip(d.sit, SIT_COR[d.sit] || "#9aa0a6") : ""}</div>
      <div style="font-size:16px;color:#263238">${esc(d.desc)}</div></div><button class="fechar" id="jan-x">✕ ${T("Fechar")}</button></div>
    <div class="jan-meta"><span>${T("Grupo")}: <b>${esc(d.grupo)}</b></span><span>${T("Sistemas")}: <b>${esc(d.sistemas.join(" | "))}</b></span><span>${T("Fase")}: <b>${esc(TS(d.fase))}</b></span>
      <span>${T("Responsável")}: <b>${esc(d.resp)}</b></span><span>${T("Data prevista")}: <b>${fmt(d.prev)}</b></span><span>${T("Data reprogramada")}: <b>${fmt(d.rep)}</b></span>
      <span>${T("1ª emissão (data)")}: <b>${fmt(d.e1)}</b></span><span>${T("Desvio (dias)")}: <b>${d.dsv ?? "—"}</b></span></div>
    <h3 style="margin:6px 0">${T("Linha do tempo")}</h3>
    <div class="linha-tempo">${svg}</div>
    <div class="legenda-lt">${usados.map(s => `<span><i style="background:${corSt(s)}"></i>${esc(TS(s))}</span>`).join("")}<span><i style="background:#f9a825"></i>${T("em análise (sem retorno)")}</span><span><i style="background:#ef9a9a;height:6px"></i>${T("com a CMI")}</span></div>
    <h3 style="margin:18px 0 6px">${T("Revisões do documento")}</h3>
    ${d.revs.length ? `<div class="tabela-wrap"><table><thead><tr>${COLS_REV().slice(6).map(([h]) => `<th>${esc(h)}</th>`).join("")}</tr></thead><tbody>${d.revs.map(r => `<tr>${COLS_REV().slice(6).map(([, f, k]) => k === "tipo" ? `<td>${r.tipo ? chip(r.tipo, TIPO_COR[r.tipo] || "#9aa0a6") : "—"}</td>` : celula(f(r), k)).join("")}</tr>`).join("")}</tbody></table></div>` : `<p class="vazio">${T("Documento ainda não emitido.")}</p>`}
  </div>`;
  m.hidden = false;
  document.getElementById("jan-x").onclick = () => { m.hidden = true; };
  m.onclick = e => { if (e.target === m) m.hidden = true; };
}
document.addEventListener("keydown", e => { if (e.key === "Escape") { document.getElementById("modal").hidden = true; document.getElementById("ajuda").hidden = true; } });

pintar();
</script>
