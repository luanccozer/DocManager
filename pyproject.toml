[tool.pytest.ini_options]
# Raiz no path (docmanager, legacy) e tests/ (builders).
pythonpath = [".", "tests"]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    # Warning conhecido do código LEGADO (replace/downcasting em pandas 2.3),
    # disparado quando os testes diferenciais chamam legacy.data_manager.
    # O código novo não dispara este warning (verificado com -W error).
    "ignore:Downcasting behavior in `replace`:FutureWarning",
    # Idem: concat de frame vazio com colunas datetime no legado (pandas 2.3).
    "ignore:The 'generic' unit for NumPy timedelta:DeprecationWarning",
]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
ignore = ["E501"]
